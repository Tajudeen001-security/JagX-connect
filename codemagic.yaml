workflows:
  android-workflow:
    name: JagX Connect - Android
    max_build_duration: 60
    instance_type: linux
    environment:
      node: 20
      vars:
        PACKAGE_NAME: "ng.jagx.buddyconnect"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Android platform (if not already committed)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - jagwaxresearchinnovation@gmail.com

  ios-workflow:
    name: JagX Connect - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add iOS platform (if not already committed)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
    artifacts:
      - ios/App/build/**/*.ipa
    publishing:
      email:
        recipients:
          - jagwaxresearchinnovation@gmail.com
