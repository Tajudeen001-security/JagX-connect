name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_JAGX_AI_BASE_URL: ${{ secrets.VITE_JAGX_AI_BASE_URL }}
          VITE_JAGX_AI_API_KEY: ${{ secrets.VITE_JAGX_AI_API_KEY }}
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate app icon & splash screen from resources/
        run: |
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Add Firebase google-services.json (for native push notifications)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON_B64 secret set yet — skipping native push wiring for this build."
          fi

      - name: Enable Google Services gradle plugin (only if google-services.json is present)
        run: |
          if [ -f "android/app/google-services.json" ]; then
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              sed -i "s#dependencies {#dependencies {\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
            fi
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            fi
          else
            echo "No google-services.json secret set yet — skipping native push setup, app will still build fine."
          fi

      - name: Verify Firebase wiring (diagnostic — check this if push notifications crash)
        run: |
          echo "== google-services.json present? =="
          if [ -f "android/app/google-services.json" ]; then
            echo "YES"
            echo "package_name in file:"
            grep "package_name" android/app/google-services.json || true
          else
            echo "NO — this is why native push will crash. Secret GOOGLE_SERVICES_JSON_B64 is missing or empty."
          fi
          echo "== android/build.gradle classpath line =="
          grep "google-services" android/build.gradle || echo "MISSING classpath line"
          echo "== android/app/build.gradle plugin line =="
          grep "google-services" android/app/build.gradle || echo "MISSING apply plugin line"
          echo "== Capacitor appId (must match package_name above) =="
          grep "appId" capacitor.config.ts || true

      - name: Ensure POST_NOTIFICATIONS permission is declared (Android 13+)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$MANIFEST"
            echo "Added POST_NOTIFICATIONS permission."
          else
            echo "POST_NOTIFICATIONS already present or manifest not found yet."
          fi

      - name: Ensure camera / mic / media permissions are declared (fixes broken video in Live + posts)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          NEEDED='<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />'
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA\"" "$MANIFEST"; then
            sed -i "0,/<application/s##${NEEDED}\n    <application#" "$MANIFEST"
            echo "Added camera/mic/media permissions."
          else
            echo "Camera permission already present or manifest not found yet."
          fi
          echo "== Final permission list =="
          grep "uses-permission\|uses-feature" "$MANIFEST" || true

      - name: Generate app icon & splash screen from logo
        run: |
          npm install -D @capacitor/assets
          mkdir -p resources
          cp "public/image-5 (1).jpg" resources/icon.png
          cp "public/image-5 (1).jpg" resources/splash.png
          npx capacitor-assets generate --android --iconBackgroundColor '#0a0a0a' --splashBackgroundColor '#0a0a0a' || echo "Icon generation skipped/failed, continuing with default icon."

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK (for quick installs/testing only — NOT for store submission)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jagx-connect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode release keystore (only if the secret is set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Release keystore decoded."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — release APK step will be skipped."
          fi

      - name: Wire release signing config into build.gradle (only if keystore is present)
        run: |
          if [ -f "android/app/release.keystore" ]; then
            GRADLE=android/app/build.gradle
            if ! grep -q "signingConfigs" "$GRADLE"; then
              sed -i "s#android {#android {\n    signingConfigs {\n        release {\n            storeFile file(\"release.keystore\")\n            storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n        }\n    }#" "$GRADLE"
            fi
            if ! grep -q "signingConfig signingConfigs.release" "$GRADLE"; then
              # Anchor on something unique to buildTypes { release { ... } }, never
              # on a bare "release {" (that also matches the signingConfigs block
              # we just inserted above, which caused the previous failure).
              if grep -q "proguardFiles getDefaultProguardFile" "$GRADLE"; then
                sed -i "s#proguardFiles getDefaultProguardFile#signingConfig signingConfigs.release\n            proguardFiles getDefaultProguardFile#" "$GRADLE"
              elif grep -q "minifyEnabled false" "$GRADLE"; then
                sed -i "s#minifyEnabled false#signingConfig signingConfigs.release\n            minifyEnabled false#" "$GRADLE"
              else
                echo "WARNING: could not find a safe anchor for buildTypes.release — signing config NOT wired. Release build will fail; check android/app/build.gradle manually."
              fi
            fi
            echo "== build.gradle signing block =="
            grep -A 6 "signingConfigs" "$GRADLE" || true
            echo "== full android {} block for diagnosis =="
            sed -n '/^android {/,/^}/p' "$GRADLE"
          else
            echo "No keystore present — skipping signing config wiring."
          fi

      - name: Build release APK (signed — this is the one to submit to Amazon/Google Play)
        if: ${{ hashFiles('android/app/release.keystore') != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload signed release APK
        if: ${{ hashFiles('android/app/release.keystore') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jagx-connect-release-apk-SIGNED
          path: android/app/build/outputs/apk/release/app-release.apk
